<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karnival · Ticketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="logo">KARNIVAL</div>
    </div>
    <div class="topbar-center">
      <div class="search-combo">
        <select class="search-mode" aria-label="Search mode">
          <option>Phone Number</option>
          <option>Email</option>
          <option>Customer ID</option>
        </select>
        <input type="text" placeholder="Search Customer By Mobile" class="search-input" />
        <button class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="topbar-right">
      <button class="brand-switch">
        <span>Allen Solly</span>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="avatar avatar-me">RU</div>
    </div>
  </header>

  <div class="app-body">
    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <a class="nav-item" data-route="home"><span class="nav-ico">🏠</span><span class="nav-label">Home</span></a>
        <div class="nav-item nav-disabled"><span class="nav-ico">👥</span><span class="nav-label">CX Management</span><span class="nav-caret">⌄</span></div>

        <div class="nav-group open" id="ticketingGroup">
          <div class="nav-item nav-parent" id="ticketingParent">
            <span class="nav-ico">🎫</span><span class="nav-label">Ticketing</span><span class="nav-caret">⌃</span>
          </div>
          <div class="nav-children">
            <a class="nav-child" data-route="tickets">All Tickets</a>
            <a class="nav-child" data-route="projects">Projects</a>
            <a class="nav-child" data-route="overview">Overview</a>
            <a class="nav-child" data-route="support">Support</a>
            <a class="nav-child" data-route="agents">Agents Reports</a>
            <a class="nav-child" data-route="source">Ticket Source</a>
            <a class="nav-child" data-route="logs">Ticket Logs</a>
          </div>
        </div>

        <div class="nav-item nav-disabled"><span class="nav-ico">🎁</span><span class="nav-label">Loyalty</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">📣</span><span class="nav-label">CRM Campaigns</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">🖥️</span><span class="nav-label">Website</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">🧾</span><span class="nav-label">POS</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">🖼️</span><span class="nav-label">UGC</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">📊</span><span class="nav-label">Analytics</span><span class="nav-caret">⌄</span></div>
        <div class="nav-item nav-disabled"><span class="nav-ico">⚙️</span><span class="nav-label">Settings</span><span class="nav-caret">⌄</span></div>
      </nav>
    </aside>

    <!-- ===== Main content ===== -->
    <main class="content" id="view"></main>
  </div>

  <!-- ===== Ticketing sheet overlay mount ===== -->
  <div class="overlay" id="overlay"></div>
  <!-- ===== Modal mount ===== -->
  <div class="modal-root" id="modalRoot"></div>
  <!-- ===== Toast mount ===== -->
  <div class="toast-wrap" id="toastWrap"></div>
  <!-- floating help -->
  <button class="fab-help" title="Help">💬</button>

  <script src="data.js?v=21"></script>
  <script src="charts.js?v=21"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
